<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#blueGrad)" />

  <!-- Outer Ring representing Digital / Connection -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="15 10" opacity="0.6" />

  <!-- Inner glowing glow behind the cross -->
  <circle cx="256" cy="256" r="100" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />

  <!-- Hospital Cross with Rounded Edges -->
  <g filter="url(#glow)">
    <rect x="220" y="116" width="72" height="280" rx="16" fill="url(#crossGrad)" />
    <rect x="116" y="220" width="280" height="72" rx="16" fill="url(#crossGrad)" />
  </g>

  <!-- Pulse waves to represent life/signal -->
  <path d="M 160 256 H 200 L 215 220 L 235 300 L 250 256 H 352" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
</svg>
